version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finstock-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev,mock
      - DB_URL=jdbc:postgresql://postgres:5432/finstock_db
      - DB_USERNAME=finstock_app
      - DB_PASSWORD=secret_dev_pass
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: finstock-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=finstock_db
      - POSTGRES_USER=finstock_app
      - POSTGRES_PASSWORD=secret_dev_pass
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: finstock-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
